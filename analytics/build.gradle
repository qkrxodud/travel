dependencies {
    api project(':common')
    // 10단계: 분석은 관찰자다 — 탐험·진행의 공개 이벤트(api.event)만 구독한다(§1 analytics: common, exploration:api.event,
    // progression:api.event). 아무 컨텍스트도 analytics 를 참조하지 않는다(ArchUnit). 공개 카드 열람은 요청 필터로 받는다(sharing 참조 없음).
    implementation project(':exploration')
    implementation project(':progression')
    // 12단계: 알림이 보낸 사실(notification.api.event.PushSent)을 push_sent 로 적는다 — 알림의 공개 이벤트만(ArchUnit).
    implementation project(':notification')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
}
