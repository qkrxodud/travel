spring:
  datasource:
    url: jdbc:h2:mem:territory;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 1단계부터 local도 Flyway 마이그레이션으로 스키마를 만들고 엔티티는 검증만 한다(create-drop 금지).
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

territory:
  mystery:
    # 이번 주 미스터리 지역 주차 시드의 서버 비밀값(8단계) — 로컬 전용 고정값. 운영은 TERRITORY_MYSTERY_SALT(application-prod.yml).
    salt: local-mystery-salt
  analytics:
    # 분석 탐험가 해시의 서버 비밀값(10단계) — 로컬 전용 고정값. 운영은 TERRITORY_ANALYTICS_SALT(application-prod.yml).
    salt: local-analytics-salt
    # 로컬은 지표 화면이 방금 보낸 이벤트를 바로 보이게
    live-cache-ttl: 0s
    ingest:
      rate-limit:
        # 로컬·E2E·테스트는 한 주소(127.0.0.1)에서 여러 방문을 흉내 내므로 주소 버킷을 넉넉히(방문 버킷은 운영과 같다)
        address-burst: 100000
        address-per-minute: 100000
  push:
    # 웹 푸시 VAPID 시험용 키(12단계) — 로컬·E2E 전용(공개해도 되는 값). 운영은 TERRITORY_VAPID_*(application-prod.yml, 이 키면 기동 실패).
    vapid:
      public-key: BL4nehRk6sf8mdeCUNdZYgFJV8YQKhg_DBB2UPhEBtJhpCGph6jaB7u4cWesO4IFwVwnsate9RFv1cnqDuuXjgU
      private-key: _rA6y0IIhChRfj6xo4JxQ9rYj8bkwc2pIuzrjvKfyY8
      subject: mailto:dev@territory.local
    # 개발용 가짜 푸시 서비스(POST /dev/push/inbox/{box})를 구독 주소로 쓸 수 있게
    allow-localhost: true
    dispatch:
      # 로컬은 계획 직후 바로 보이도록 짧게
      delay-ms: 2000
      initial-delay-ms: 3000
      max-per-second: 200
      send-timeout: 3s
  dev:
    # /dev/**(reset·seed·login 등) 켜기 — 이 파일에만 둔다. local 프로파일 + 이 값이 모두 있어야 빈이 생긴다(QA P3-11).
    enabled: true
  admin:
    # 로컬 전용 관리자 토큰(X-Admin-Token). http/stage3-wardrobe.http·E2E 가 쓴다.
    token: local-admin-token
  outbox:
    relay:
      # 로컬은 체크인 → 진행 반영(비동기)이 화면에서 바로 보이도록 짧게.
      delay-ms: 300
      backoff:
        initial-ms: 100
        max-ms: 2000
  recalculation:
    delay-ms: 300

logging:
  level:
    com.kobi.territory: DEBUG
