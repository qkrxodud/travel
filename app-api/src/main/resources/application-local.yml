spring:
  datasource:
    url: jdbc:h2:mem:territory;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 1단계부터 local도 Flyway 마이그레이션으로 스키마를 만들고 엔티티는 검증만 한다(create-drop 금지).
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.kobi.territory: DEBUG
