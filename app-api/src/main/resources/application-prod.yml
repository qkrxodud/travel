spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  # TLS 를 끝내는 프록시 뒤 — X-Forwarded-Proto/Host 를 스프링이 반영(세션·CSRF 쿠키 Secure, 스킴). 절대 주소는 public-base-url 로.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

territory:
  # 공개 기준 주소 — 환경변수 필수(og:image·og:url, 예: https://territory.kr). 없으면 기동 실패.
  public-base-url: ${TERRITORY_PUBLIC_BASE_URL}
  admin:
    # 운영 관리자 토큰 — 환경변수 필수(없으면 기동 실패).
    token: ${TERRITORY_ADMIN_TOKEN}
  mystery:
    # 이번 주 미스터리 지역 주차 시드의 서버 비밀값 — 환경변수 필수(없으면 기동 실패). 바꾸면 아직 기록되지 않은 주부터 다른 지역이 된다
    # (이미 기록된 주는 mystery_week 그대로).
    salt: ${TERRITORY_MYSTERY_SALT}
  analytics:
    # 분석 탐험가 해시에 섞는 서버 비밀값(10단계) — 환경변수 필수(없으면 기동 실패). 바꾸면 그때부터 같은 탐험가를 다른 사람으로 센다
    # (코호트·리텐션이 끊긴다) — 한 번 정하면 바꾸지 않는다.
    salt: ${TERRITORY_ANALYTICS_SALT}
