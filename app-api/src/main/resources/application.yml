spring:
  application:
    name: territory
  profiles:
    default: local
  autoconfigure:
    # 4단계 보안: 사용자/비밀번호 로그인은 없다(구글 OIDC·익명 토큰만) — 기본 사용자 생성·비밀번호 로그를 끈다.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        # Instant 를 DATETIME(6)(UTC 저장)에 매핑한다 — 기본값(TIMESTAMP WITH TIME ZONE)이면 validate가 실패한다.
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
          # 5단계: 할당 id 엔티티의 여러 insert 를 JDBC 배치로(상위 % 배치 스냅숏 저장 — QA P3-7). IDENTITY 엔티티는 배치되지 않는다.
          batch_size: 100
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # 상대 리디렉트(Location: /#profile) — Tomcat 이 요청 Host 헤더로 절대 주소를 만들지 않게(QA P3-2)
    use-relative-redirects: true
  servlet:
    session:
      # 4단계 로그인 세션(같은 출처 웹). 저장은 서버 메모리(local) — 다중 인스턴스는 이후 세션 저장소.
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health, info

territory:
  check-in:
    daily-cap: 5
    onboarding-grace-hours: 72
  wishlist:
    # 가고 싶은 곳(9단계): 아직 다녀오지 않은 핀의 최대 수(탐험가당, 비공개)
    max-pins: 30
  map:
    # 탈퇴 유예: 이 기간 안에 초대코드로 돌아오면 방문 복구(선점은 안 돌아옴), 지나면 배치가 숨긴 방문을 하드 삭제한다.
    leave-grace-days: 7
    # 유예 종료 배치 주기(ms)
    purge-interval-ms: 600000
  # 공개 기준 주소(og:image·og:url, OAuth redirect_uri 등 밖으로 나가는 절대 주소). 요청 Host 헤더를 믿지 않는다(QA P3-2). 기본은 이 서버의 localhost 주소,
  # prod 는 TERRITORY_PUBLIC_BASE_URL 필수(application-prod.yml).
  public-base-url: ${TERRITORY_PUBLIC_BASE_URL:http://localhost:${server.port}}
  share-card:
    # 카드 최소 캐시 시간: 한 번 그린 카드는 영토·장면이 바뀌어도 이 시간 동안은 그대로 낸다(링크가 열릴 때 lazy 렌더).
    cache-ttl-minutes: 10
    # 카드 PNG 저장 경로(캐시 — 지워져도 다시 그린다). build/ 밖. 운영은 TERRITORY_CARD_DIR 로 지정(이후 오브젝트 스토리지).
    storage-dir: ${TERRITORY_CARD_DIR:${java.io.tmpdir}/territory/share-cards}
  # "하루"(하루 상한)·"오늘"(미래 날짜 판정)의 기준 시간대. Clock 빈의 zone 이 된다.
  time-zone: Asia/Seoul
  outbox:
    relay:
      enabled: true
      delay-ms: 1000
      # 구독자별 재시도 상한(D5). 넘으면 그 전달은 FAILED — 같은 (aggregate, 구독자) 단위는 재전달 전까지 멈춘다.
      # 낙관적 락 충돌은 상한에 세지 않는다(백오프로 계속 재시도).
      max-attempts: 5
      # 재시도 간격: 지수 백오프(initial × 2^(n−1), 최대 max) + 지터(50~100%)
      backoff:
        initial-ms: 500
        max-ms: 30000
      # 낙관적 락 충돌 재시도의 시간 상한(결정 5) — 첫 충돌부터 이 시간을 넘기면 FAILED(재전달 경로로).
      conflict-retry-limit: 10m
  wardrobe:
    # 꾸미기 점수(StylePoints) = 착용 아이템(슬롯 + 장식) 희귀도 점수 합. 프로토타입 TIER.pts 와 같은 값.
    style-points:
      common: 1
      rare: 3
      legend: 8
  # 운영 API(/admin/**) 관리자 토큰(X-Admin-Token). 기본값 없음 — local 은 application-local.yml, prod 는 환경변수.
  # 4단계 로그인 도입 후 역할 기반 인가로 대체.
  # admin.token: (프로파일별)
  account:
    # handle 을 바꾸면 옛 handle 을 이 기간 동안 다른 탐험가가 못 가져간다(공유된 /u/옛handle 링크 탈취 방지, QA P3-10)
    handle-reservation-days: 30
  auth:
    # 구글 OIDC 클라이언트 — 값은 환경변수로만(코드·yml 에 키를 두지 않는다). 둘 중 하나라도 없으면 로그인 비활성(앱은 정상 기동, WARN).
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  recalculation:
    # 재계산 예약 배치(병합 뒤 진행·인벤토리 재계산 — 보류 규칙을 만족할 때까지 주기마다 다시 본다)
    enabled: true
    delay-ms: 2000
  social:
    # 5단계 소셜. 친구 소식 한 번에 보여 줄 건수
    feed-size: 30
    # 일 1회 집계 배치(상위 %·지역별 방문자 비율·시·도 평균) — cron(초 분 시 일 월 요일, territory.time-zone 기준). "-" 면 끔.
    # 설계의 Redis 대신 DB(rank_percentile·region_stats·province_stats) + 애플리케이션 캐시 — Redis 는 트래픽이 생긴 뒤.
    rank-batch-cron: "0 30 4 * * *"
    # 배치 스냅숏 애플리케이션 캐시 시간(인스턴스 메모리). 배치가 끝나면 그 인스턴스는 바로 비운다.
    stats-cache-ttl: 5m
    feed-rebuild:
      # 친구 소식 재구성에서 허용할 처리 실패 건수 — 넘으면 FAILED(이전 세대 유지). 읽을 수 없는 예전 outbox 행은 세지 않는다.
      max-skipped: 0
  analytics:
    # 10단계 분석(자체 수집·익명). 서버 비밀값 salt 는 프로파일별(local 고정값, 운영 TERRITORY_ANALYTICS_SALT 필수).
    # salt: (프로파일별)
    # 원본 이벤트 보관 일수 — 지난 원본은 일 배치가 지운다(집계 analytics_daily·analytics_cohort 는 남는다)
    retention-days: 90
    # 일 배치가 코호트(퍼널·리텐션)를 다시 계산하는 지난 날 수(D30 리텐션이 채워지도록). 31(D30+1) 이상, 보관 일수 − 집계 구간보다 작게.
    # 하루 지표(DAU/WAU/MAU·K 계수 등 — 30일 구간이라 무겁다)는 이 기간 안에서 아직 계산하지 않은 날 + 최근 daily-recompute-days 일만.
    recompute-days: 35
    daily-recompute-days: 3
    # 일 배치 — cron(초 분 시 일 월 요일, territory.time-zone 기준). "-" 면 끔. 운영 수동 실행: POST /admin/metrics/batch
    batch-cron: "0 10 4 * * *"
    # 기능별 사용률·상위 오류 코드 구간 / K 계수 구간(일)
    feature-window-days: 7
    k-window-days: 30
    funnel:
      # 퍼널 2단계: 첫 화면 날부터 이 일수 안의 첫 체크인 / 3단계: 첫 체크인 다음 날부터 이 일수 안의 재방문
      check-in-window-days: 7
      revisit-window-days: 7
    # K 계수의 초대 유입: 가입 후 이 일수 안에 초대(초대코드·프로필 링크)로 공유 지도에 합류
    invite-attribution-days: 7
    max-report-days: 90
    top-error-codes: 10
    # 오늘(실시간) 지표 재사용 시간 — 운영 MySQL 부하(30일 구간 집계). local 은 0
    live-cache-ttl: 60s
    # 믿는 프록시(쉼표로 CIDR·주소). 기본 비어 있음 = 아무도 믿지 않음(클라이언트가 보낸 X-Forwarded-For 로 레이트 리밋을 피할 수 없게).
    # Cloudflare Tunnel(cloudflared) 을 compose 네트워크에 붙이면 그 네트워크 대역 — doc/operations.md 10단계
    trusted-proxies: ${TERRITORY_TRUSTED_PROXIES:}
    ingest:
      # POST /events: 한 번에 받는 이벤트 수·본문 크기 상한, 화면 시각을 믿는 범위(그보다 옛날이면 받은 시각)
      max-batch-events: 50
      max-body-bytes: 32768
      max-clock-skew: 24h
      # 레이트 리밋(요청 수, 인스턴스 메모리 — 단일 인스턴스 가정). 방문 ID 마다 + 요청 주소마다(주소는 저장하지 않는다).
      # 요청 주소는 실제 접속 주소 — 아래 trusted-proxies 에서 온 요청만 CF-Connecting-IP·X-Forwarded-For(오른쪽부터)를 믿는다
      rate-limit:
        visitor-burst: 20
        visitor-per-minute: 30
        address-burst: 60
        address-per-minute: 120
        max-tracked-keys: 100000
  push:
    # 12단계 웹 푸시(VAPID). 키는 프로파일별 — local 은 application-local.yml 시험용 키, 운영은 TERRITORY_VAPID_* 필수(application-prod.yml).
    # vapid: {public-key, private-key, subject}(프로파일별)
    # 받을 구독 주소의 호스트(서버가 그 주소로 직접 요청을 보내므로 알려진 브라우저 푸시 서비스만 — SSRF 방지). "*.도메인" 은 하위 도메인
    allowed-hosts: "fcm.googleapis.com,updates.push.services.mozilla.com,*.push.services.mozilla.com,*.push.apple.com,*.notify.windows.com"
    # localhost·127.0.0.1 을 http 로도 받기(개발용 가짜 푸시 서비스) — local 만
    allow-localhost: false
    # 탐험가 한 명의 기기(브라우저 구독) 수 — 넘으면 가장 오래 전에 등록한 기기를 뺀다
    max-devices: 5
    # 조용한 시간(territory.time-zone 기준) — 이 시간에는 보내지 않고 다음 허용 시각(끝 시각)으로 미룬다
    quiet-hours:
      start: "22:00"
      end: "08:00"
    # 한 사람이 하루(서울 날짜)에 받는 알림 최대 개수 — 같은 날 겹치면 먼저 계획된 알림만
    daily-limit: 1
    # 기기가 꺼져 있을 때 푸시 서비스가 들고 있을 시간(TTL)
    ttl: 12h
    schedule:
      # 알림 3종 cron(초 분 시 일 월 요일, territory.time-zone 기준). "-" 면 그 알림은 끔. 같은 날 겹치면 먼저 도는 알림이 이긴다(계절 → 미스터리 → 스트릭)
      season-cron: "0 30 8 * * *"
      mystery-cron: "0 0 9 * * MON"
      streak-cron: "0 0 19 * * *"
      # 스트릭 지키기 날 = 그 달 마지막 날 − 이 일수(3 이면 10월은 28일)
      streak-days-before-month-end: 3
    dispatch:
      enabled: true
      # 발송기 주기(ms) — 보낼 때가 된 기록을 잡아 보낸다
      delay-ms: 30000
      initial-delay-ms: 15000
      # 받을 사람을 한 번에 불러오는 수(계획) / 발송기가 한 번에 잡는 기록 수
      page-size: 500
      batch-size: 100
      # 초당 최대 보내기 수(인스턴스 하나 기준 — 단일 인스턴스 가정, doc/operations.md 12단계)
      max-per-second: 20
      send-timeout: 10s
      # 푸시 서비스가 잠시 받지 못하면(429·5xx·연결 실패) 지수 백오프로 다시 — 그날 안·조용한 시간 전까지만(넘으면 만료)
      max-attempts: 4
      retry-initial: 5m
      retry-max: 1h
      # 보내는 중으로 이 시간 넘게 머문 기록은 발송기가 죽은 것으로 보고 다시 잡는다(최소 1회)
      claim-timeout: 10m
  progression:
    # 운영 재계산 배치 진입점: 기동 시 모든 탐험가의 진행·도감·퀘스트를 Territory 로부터 다시 만든다(정의 변경·버그 복구용).
    #   java -jar territory.jar --territory.progression.recalculate-on-startup=true
    recalculate-on-startup: false
