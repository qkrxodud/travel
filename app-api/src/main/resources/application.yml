spring:
  application:
    name: territory
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info

territory:
  check-in:
    daily-cap: 5
    onboarding-grace-hours: 72
  map:
    leave-grace-days: 7
  share-card:
    cache-ttl-minutes: 10
