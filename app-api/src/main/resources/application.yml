spring:
  application:
    name: territory
  profiles:
    default: local
  autoconfigure:
    # 4단계 보안: 사용자/비밀번호 로그인은 없다(구글 OIDC·익명 토큰만) — 기본 사용자 생성·비밀번호 로그를 끈다.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        # Instant 를 DATETIME(6)(UTC 저장)에 매핑한다 — 기본값(TIMESTAMP WITH TIME ZONE)이면 validate가 실패한다.
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # 상대 리디렉트(Location: /#profile) — Tomcat 이 요청 Host 헤더로 절대 주소를 만들지 않게(QA P3-2)
    use-relative-redirects: true
  servlet:
    session:
      # 4단계 로그인 세션(같은 출처 웹). 저장은 서버 메모리(local) — 다중 인스턴스는 이후 세션 저장소.
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health, info

territory:
  check-in:
    daily-cap: 5
    onboarding-grace-hours: 72
  map:
    # 탈퇴 유예: 이 기간 안에 초대코드로 돌아오면 방문 복구(선점은 안 돌아옴), 지나면 배치가 숨긴 방문을 하드 삭제한다.
    leave-grace-days: 7
    # 유예 종료 배치 주기(ms)
    purge-interval-ms: 600000
  # 공개 기준 주소(og:image·og:url, OAuth redirect_uri 등 밖으로 나가는 절대 주소). 요청 Host 헤더를 믿지 않는다(QA P3-2). 기본은 이 서버의 localhost 주소,
  # prod 는 TERRITORY_PUBLIC_BASE_URL 필수(application-prod.yml).
  public-base-url: ${TERRITORY_PUBLIC_BASE_URL:http://localhost:${server.port}}
  share-card:
    # 카드 최소 캐시 시간: 한 번 그린 카드는 영토·장면이 바뀌어도 이 시간 동안은 그대로 낸다(링크가 열릴 때 lazy 렌더).
    cache-ttl-minutes: 10
    # 카드 PNG 저장 경로(캐시 — 지워져도 다시 그린다). build/ 밖. 운영은 TERRITORY_CARD_DIR 로 지정(이후 오브젝트 스토리지).
    storage-dir: ${TERRITORY_CARD_DIR:${java.io.tmpdir}/territory/share-cards}
  # "하루"(하루 상한)·"오늘"(미래 날짜 판정)의 기준 시간대. Clock 빈의 zone 이 된다.
  time-zone: Asia/Seoul
  outbox:
    relay:
      enabled: true
      delay-ms: 1000
      # 구독자별 재시도 상한(D5). 넘으면 그 전달은 FAILED — 같은 (aggregate, 구독자) 단위는 재전달 전까지 멈춘다.
      # 낙관적 락 충돌은 상한에 세지 않는다(백오프로 계속 재시도).
      max-attempts: 5
      # 재시도 간격: 지수 백오프(initial × 2^(n−1), 최대 max) + 지터(50~100%)
      backoff:
        initial-ms: 500
        max-ms: 30000
      # 낙관적 락 충돌 재시도의 시간 상한(결정 5) — 첫 충돌부터 이 시간을 넘기면 FAILED(재전달 경로로).
      conflict-retry-limit: 10m
  wardrobe:
    # 꾸미기 점수(StylePoints) = 착용 아이템(슬롯 + 장식) 희귀도 점수 합. 프로토타입 TIER.pts 와 같은 값.
    style-points:
      common: 1
      rare: 3
      legend: 8
  # 운영 API(/admin/**) 관리자 토큰(X-Admin-Token). 기본값 없음 — local 은 application-local.yml, prod 는 환경변수.
  # 4단계 로그인 도입 후 역할 기반 인가로 대체.
  # admin.token: (프로파일별)
  account:
    # handle 을 바꾸면 옛 handle 을 이 기간 동안 다른 탐험가가 못 가져간다(공유된 /u/옛handle 링크 탈취 방지, QA P3-10)
    handle-reservation-days: 30
  auth:
    # 구글 OIDC 클라이언트 — 값은 환경변수로만(코드·yml 에 키를 두지 않는다). 둘 중 하나라도 없으면 로그인 비활성(앱은 정상 기동, WARN).
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  recalculation:
    # 재계산 예약 배치(병합 뒤 진행·인벤토리 재계산 — 보류 규칙을 만족할 때까지 주기마다 다시 본다)
    enabled: true
    delay-ms: 2000
  progression:
    # 운영 재계산 배치 진입점: 기동 시 모든 탐험가의 진행·도감·퀘스트를 Territory 로부터 다시 만든다(정의 변경·버그 복구용).
    #   java -jar territory.jar --territory.progression.recalculate-on-startup=true
    recalculate-on-startup: false
