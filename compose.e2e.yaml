# E2E(Playwright) 전용 오버라이드 — 운영과 섞이지 않게 반드시 별도 프로젝트 이름으로 띄운다:
#   docker compose -p territory-e2e -f compose.yaml -f compose.e2e.yaml up -d --build
#   cd e2e && E2E_PORT=18090 npx playwright test
#   docker compose -p territory-e2e -f compose.yaml -f compose.e2e.yaml down -v
# -p territory-e2e 이므로 볼륨(territory-e2e_mysql-data 등)·네트워크·컨테이너가 운영(territory)과 분리된다.
#
# dev 엔드포인트(/dev/**)는 @Profile("local") + territory.dev.enabled=true(application-local.yml) 일 때만 생긴다.
# 그래서 프로파일을 local 로 두고, local yml 의 H2 datasource 만 환경변수로 MySQL 로 덮는다(환경변수 > 프로파일 yml).
# jar 에 새 프로파일 파일을 넣지 않으므로 운영 compose(SPRING_PROFILES_ACTIVE=prod)에서 dev 가 켜질 경로가 없다.
name: territory-e2e

services:
  app:
    container_name: territory-e2e-app
    image: territory-app:e2e
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-territory}?characterEncoding=UTF-8&connectionTimeZone=UTC
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_H2_CONSOLE_ENABLED: "false"
      # E2E(fixtures·http 파일)가 쓰는 local 관리자 토큰. 운영 .env 값이 relaxed binding 으로 덮지 않게 명시.
      TERRITORY_ADMIN_TOKEN: local-admin-token
      # 미스터리 지역 주차 시드 — local 프로파일 기본값과 같게(운영 .env 값이 덮지 않게 명시)
      TERRITORY_MYSTERY_SALT: local-mystery-salt
      # og:image 등 절대 주소 — 호스트에서 보이는 E2E 주소
      TERRITORY_PUBLIC_BASE_URL: http://localhost:18090
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      LOGGING_LEVEL_COM_KOBI_TERRITORY: INFO
    ports: !override
      - "127.0.0.1:18090:8080"
    restart: "no"

  mysql:
    container_name: territory-e2e-mysql
    restart: "no"
