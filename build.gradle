plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    // 웹 프론트(frontend/, Vite + React) 빌드 — Node 를 Gradle 이 받아 npm ci·build 를 돌린다(app-api 가 적용)
    id 'com.github.node-gradle.node' version '7.1.0' apply false
}

// 루트는 빌드 설정만 가진다. 루트 jar(빈 territory-0.0.1-SNAPSHOT.jar)가 territory.jar와 헷갈리지 않게 끈다.
tasks.named('jar') { enabled = false }

allprojects {
    group = 'com.kobi'
    version = '0.0.1-SNAPSHOT'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        // JUnit 5.12+ 는 launcher 버전 정렬이 필요하다(없으면 "OutputDirectoryProvider not available").
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') { useJUnitPlatform() }
}

// 규칙 문서: 테스트 소스 선언 순서(클래스 → @Nested → 테스트, @DisplayName)대로 build/reports/test-docs/{모듈}.md·index.md 를 만든다.
// 테스트를 돌리지 않는다 — 최근 결과 XML 이 있으면 통과 표시만 붙인다(./gradlew test testDocs 로 함께 실행 가능).
tasks.register('testDocs', territory.TestDocsTask) {
    group = 'documentation'
    description = '테스트 소스 순서대로 모듈별 규칙 문서(build/reports/test-docs)를 만든다'
    subprojects.each { p ->
        def src = p.file('src/test/java')
        def res = p.layout.buildDirectory.dir('test-results').get().asFile
        sourceRoots.put(p.name, src.absolutePath)
        resultRoots.put(p.name, res.absolutePath)
        sources.from(p.fileTree(src) { include '**/*.java' })
        results.from(p.fileTree(res) { include '**/TEST-*.xml' })
        mustRunAfter(p.tasks.withType(Test))
    }
    outputDir = layout.buildDirectory.dir('reports/test-docs')
}
