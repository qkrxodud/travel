# 나의 영토(territory) — Docker Compose 로컬 운영(초기 운영 환경). 사용법: doc/operations.md "Docker Compose 로컬 운영".
#   docker compose up -d --build      # 기동(프로젝트 이름 territory)
# 비밀값은 .env(커밋 금지) — .env.example 을 복사해 채운다.
name: territory

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-territory}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME 을 .env 에 설정}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 를 .env 에 설정}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 서버 기본 시간대는 서울(+09:00). 앱은 UTC 로 저장한다(hibernate.jdbc.time_zone=UTC, JDBC connectionTimeZone=UTC).
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    # 호스트 포트는 기본 미노출(앱만 접근). 직접 접속이 필요하면 compose.override.yaml 에 "127.0.0.1:13306:3306" 을 추가하거나
    # docker compose exec mysql mysql -u... 를 쓴다.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: territory-app:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 운영 프로파일 고정(operations.md N4 — profiles.default=local 이 켜지면 /dev/** 가 열린다). .env 로 바꾸지 않는다.
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-territory}?characterEncoding=UTF-8&connectionTimeZone=UTC
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TERRITORY_ADMIN_TOKEN: ${TERRITORY_ADMIN_TOKEN:?TERRITORY_ADMIN_TOKEN 을 .env 에 설정}
      TERRITORY_PUBLIC_BASE_URL: ${TERRITORY_PUBLIC_BASE_URL:-http://localhost:18080}
      TERRITORY_MYSTERY_SALT: ${TERRITORY_MYSTERY_SALT:?TERRITORY_MYSTERY_SALT 을 .env 에 설정}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TERRITORY_CARD_DIR: /data/share-cards
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=25 -XX:+ExitOnOutOfMemoryError -Djava.awt.headless=true -Dfile.encoding=UTF-8}
    ports:
      # 루프백에만 노출(호스트 8080 은 다른 앱이 사용 중 — 쓰지 않는다). 외부 공개는 TLS 리버스 프록시를 앞에 둔다.
      - "127.0.0.1:18080:8080"
    volumes:
      - share-cards:/data/share-cards
    mem_limit: 1g
    stop_grace_period: 40s
    logging: *default-logging

volumes:
  mysql-data:
  share-cards:
